# fly.io config — deploy with: fly launch --copy-config --no-deploy && fly deploy
app = "gaurang-job-agent"
primary_region = "bom"

[build]

[env]
  PORT = "3040"

[[mounts]]
  source = "jobagent_data"
  destination = "/app/data"

[http_service]
  internal_port = 3040
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
